name: Daily Release Checker

on:
  schedule:
    # Runs automatically every day at 13:38 PM (Noon) UTC time
    - cron: '36 * * * *'
  
  # Adds a button so you can trigger it manually whenever you want
  workflow_dispatch: 

jobs:
  update-json:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Check out your repository code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # <--- THIS IS THE ONLY CHANGE

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: pip install requests

      - name: Run script to check for updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_releases.py

      - name: Save and commit changes if P.json was updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add P.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update P.json releases" && git push)
