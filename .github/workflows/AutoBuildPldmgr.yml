name: Auto-Build Custom pldmgr.elf

on:
  schedule:
    - cron: '26 14 * * *'
  workflow_dispatch:

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Get latest release version of official pldmgr
        id: get_tag
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/itsPLK/ps5-payload-manager/releases/latest | jq -r '.tag_name')
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Error: Failed to fetch latest tag from upstream repository."
            exit 1
          fi

          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Found upstream tag: $LATEST_TAG"
          
      - name: Check if we already released this version
        id: check_release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.get_tag.outputs.tag }})
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.get_tag.outputs.tag }} already exists. Skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout the official source code
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: itsPLK/ps5-payload-manager
          ref: ${{ steps.get_tag.outputs.tag }}
          submodules: recursive

      - name: Patch the Default Source URL
        if: steps.check_release.outputs.exists == 'false'
        run: |
          find . -type f -exec sed -i 's|https://itsplk.github.io/ps5-payloads-mirror/payloads.json|https://maorgranot1.github.io/my-ps5-payloads/P.json|g' {} +

      - name: Patch repository.c and payload_mgr.c for Autoloader Mirroring
        if: steps.check_release.outputs.exists == 'false'
        run: |
          cat << 'EOF' > patch_c_code.py
          import os, sys

          helpers = r"""
          static const char* get_autoloader_dest_name(const char *filename) {
              if (!filename) return NULL;
              char lower[256];
              int i;
              strncpy(lower, filename, sizeof(lower) - 1);
              lower[255] = '\0';
              for (i = 0; lower[i]; i++) {
                  lower[i] = tolower((unsigned char)lower[i]);
              }
              if (strstr(lower, "kstuff") != NULL) return "kstuff.elf";
              if (strstr(lower, "shadowmountplus") != NULL) return "shadowmountplus.elf";
              if (strstr(lower, "pldmgr") != NULL) return "pldmgr.elf";
              return NULL;
          }

          static int autoloader_copy_file(const char *src, const char *dst) {
              FILE *in = fopen(src, "rb");
              if (!in) return -1;
              FILE *out = fopen(dst, "wb");
              if (!out) {
                  fclose(in);
                  return -1;
              }
              char buf[8192];
              size_t n;
              while ((n = fread(buf, 1, sizeof(buf), in)) > 0) {
                  if (fwrite(buf, 1, n, out) != n) {
                      fclose(in);
                      fclose(out);
                      return -1;
                  }
              }
              fclose(in);
              fclose(out);
              return 0;
          }

          static void handle_autoloader_copy(const char *src_path, const char *filename) {
              const char* dest_name = get_autoloader_dest_name(filename);
              if (dest_name != NULL) {
                  char auto_path[512];
                  ensure_dir_recursive("/data/ps5_autoloader");
                  snprintf(auto_path, sizeof(auto_path), "/data/ps5_autoloader/%s", dest_name);
                  
                  if (autoloader_copy_file(src_path, auto_path) == 0) {
                      pldmgr_log("[PLDMGR] Autoloader mirror updated successfully: %s\n", dest_name);
                  } else {
                      pldmgr_log("[PLDMGR] ERROR: Failed to update autoloader mirror for %s\n", dest_name);
                  }
              }
          }
          """

          # --- 1. Patch src/repository.c (Handles Repository Downloads) ---
          repo_file = "src/repository.c"
          if not os.path.exists(repo_file):
              print("Error: src/repository.c not found")
              sys.exit(1)

          with open(repo_file, 'r', encoding='utf-8') as f:
              repo_content = f.read()

          repo_anchor = "int repository_install_commit("
          if repo_anchor not in repo_content:
              print("Error: repository_install_commit anchor not found in repository.c")
              sys.exit(1)

          repo_content = repo_content.replace(repo_anchor, helpers + "\n\n" + repo_anchor, 1)

          # Match the complete 'if (' statement in repository.c
          repo_hook = "if (write_payload_details_json(&items[found], details_path, install_source, install_source_detail) != 0) {"
          if repo_hook not in repo_content:
              print("Error: write_payload_details_json hook line not found in repository.c")
              sys.exit(1)

          repo_content = repo_content.replace(
              repo_hook,
              f'handle_autoloader_copy(final_path, items[found].filename);\n    {repo_hook}',
              1
          )

          with open(repo_file, 'w', encoding='utf-8') as f:
              f.write(repo_content)
          print("Successfully patched src/repository.c")

          # --- 2. Patch src/payload_mgr.c (Handles Manual & USB Uploads) ---
          payload_file = "src/payload_mgr.c"
          if not os.path.exists(payload_file):
              print("Error: src/payload_mgr.c not found")
              sys.exit(1)

          with open(payload_file, 'r', encoding='utf-8') as f:
              payload_content = f.read()

          payload_anchor = "void payload_mgr_remove_old_files"
          if payload_anchor not in payload_content:
              print("Error: payload_mgr_remove_old_files anchor not found in payload_mgr.c")
              sys.exit(1)

          payload_content = payload_content.replace(payload_anchor, helpers + "\n\n" + payload_anchor, 1)

          target_net = 'write_simple_payload_details_json(filename, details_path, install_source, install_source_detail);'
          if target_net in payload_content:
              payload_content = payload_content.replace(
                  target_net,
                  f'handle_autoloader_copy(final_path, filename);\n    {target_net}',
                  1
              )

          target_usb = 'write_simple_payload_details_json(filename, details_path, "usb", usb_path);'
          if target_usb in payload_content:
              payload_content = payload_content.replace(
                  target_usb,
                  f'handle_autoloader_copy(final_path, filename);\n    {target_usb}',
                  1
              )

          with open(payload_file, 'w', encoding='utf-8') as f:
              f.write(payload_content)
          print("Successfully patched src/payload_mgr.c")

          EOF
          python3 patch_c_code.py
      
      - name: Setup Node.js (For Web UI Build)
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build the Web Interface
        if: steps.check_release.outputs.exists == 'false'
        run: make frontend-build

      - name: Build the PS5 SDK Docker Environment
        if: steps.check_release.outputs.exists == 'false'
        run: docker build -t ps5-payload-sdk -f Dockerfile.sdk .

      - name: Compile the modified ELF file
        if: steps.check_release.outputs.exists == 'false'
        run: docker run --rm -v $(pwd):/src -w /src ps5-payload-sdk make clean all

      - name: Publish the New Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Custom Build ${{ steps.get_tag.outputs.tag }}"
          body: "Automated compile of pldmgr.elf with autoloader payload mirroring."
          files: pldmgr.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
